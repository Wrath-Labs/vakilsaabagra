<!doctype html>
<html><head><meta charset="utf-8"><title>Vakil Saab Agra — email signature preview</title>
<style>
  /* A preview render of the pasteable snippet that ships at
     assets/brand/print/email-signature.html. Keep the two in step — this is
     what the snippet is supposed to look like once a mail client has had its
     way with it. */
  html, body { width: 900px; height: 240px; }
  .canvas { width: 900px; height: 240px; display: flex; align-items: center; gap: 30px; padding: 34px 40px; }
  .mark { flex: 0 0 84px; }
  .bar { flex: 0 0 1px; align-self: stretch; background: var(--line); }
  .name { font-size: 24px; font-weight: 700; line-height: 1.15; color: var(--ink); }
  .role { margin-top: 5px; font-size: 14px; color: var(--muted); }
  .meta { margin-top: 14px; font-size: 13.5px; line-height: 1.75; color: var(--muted); }
  .meta a { color: var(--gold); text-decoration: none; font-weight: 600; }
  .strap { margin-top: 14px; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; font-weight: 700; color: var(--gold); }
</style></head>
<body>
<div class="canvas light">
  <div class="mark">{{svg:icon/mark-navy.svg}}</div>
  <div class="bar"></div>
  <div>
    <div class="display name">Subroto Banerjee</div>
    <div class="role">Co-founder, Vakil Saab Agra</div>
    <div class="meta">
      +91 89544 02360 &nbsp;&middot;&nbsp; <a>vakilsaabagra.in</a><br>
      Agra, Uttar Pradesh
    </div>
    <div class="strap">A Wrath Labs venture</div>
  </div>
</div>
</body></html>
