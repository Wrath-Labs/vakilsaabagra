<!doctype html>
<html><head><meta charset="utf-8"><title>Vakil Saab Agra — A4 poster</title>
<style>
  /* A4 at 96 DPI, shot at dpiScale 3 for a 300 DPI print. Meant to be pinned
     up in a chamber or a court corridor, so it is read from two metres: one
     idea, the domain, and nothing that needs squinting at. */
  html, body { width: 827px; height: 1169px; }
  .canvas { width: 827px; height: 1169px; padding: 96px 76px 84px; display: flex;
            flex-direction: column; align-items: center; text-align: center; }
  .logo { width: 330px; }
  .rule { width: 110px; height: 3px; margin-top: 46px; }
  h1 { font-size: 62px; font-weight: 700; line-height: 1.08; margin-top: 46px; }
  h1 .em { color: var(--gold-2); }
  .light h1 .em { color: var(--gold); }
  .hi { margin-top: 22px; font-size: 27px; line-height: 1.5; color: var(--slate); }
  .light .hi { color: var(--muted); }
  .chips { gap: 10px; margin-top: 46px; justify-content: center; }
  .chip { font-size: 15px; font-weight: 500; padding: 10px 20px; }
  .cta { margin-top: auto; width: 100%; }
  .cta .label { font-size: 14px; letter-spacing: .28em; text-transform: uppercase; font-weight: 700; color: var(--gold-2); }
  .light .cta .label { color: var(--gold); }
  .cta .domain { margin-top: 16px; font-size: 52px; font-weight: 700; letter-spacing: -.02em; }
  .cta .phone { margin-top: 18px; font-size: 22px; color: var(--slate); }
  .light .cta .phone { color: var(--muted); }
  .orb { --orb: 620px; right: -200px; top: -240px; }
  .orb2 { --orb: 520px; left: -200px; bottom: -180px; }
</style></head>
<body>
<div class="canvas dark">
  <div class="orb"></div><div class="orb orb2"></div>
  <div class="grid-wash" style="--grid:52px"></div>
  <div class="logo">{{svg:logo/logo-stacked-dark.svg}}</div>
  <div class="rule"></div>
  <h1 class="display">Find the right advocate <span class="em">in Agra.</span></h1>
  <div class="hi">आगरा में सही वकील खोजें —<br>प्रैक्टिस क्षेत्र, अनुभव और इलाके से।</div>
  <div class="chips">
    <span class="chip">Criminal</span><span class="chip">Family</span><span class="chip">Property</span>
    <span class="chip">Cheque Bounce</span><span class="chip">Consumer</span><span class="chip">Corporate</span>
  </div>
  <div class="cta">
    <div class="label">Search free</div>
    <div class="display domain">vakilsaabagra.in</div>
    <div class="phone">+91 89544 02360</div>
  </div>
</div>
</body></html>
