<!doctype html>
<html><head><meta charset="utf-8"><title>Vakil Saab Agra — Facebook cover</title>
<style>
  html, body { width: 1640px; height: 856px; }
  /* Facebook shows this at 820x312 on desktop and crops the sides on mobile,
     so the whole composition lives inside a centred 1180x560 safe box and the
     rest of the canvas is texture. */
  .canvas { width: 1640px; height: 856px; display: grid; place-items: center; }
  .safe { width: 1180px; text-align: center; }
  .logo { width: 460px; margin: 0 auto; }
  .eyebrow { font-size: 18px; margin-top: 34px; }
  h1 { font-size: 54px; font-weight: 700; line-height: 1.1; margin-top: 16px; }
  h1 .em { color: var(--gold-2); }
  .light h1 .em { color: var(--gold); }
  .chips { gap: 13px; margin-top: 30px; justify-content: center; }
  .chip { font-size: 17px; font-weight: 500; padding: 10px 22px; }
  .url { margin-top: 34px; font-size: 22px; }
  .orb { --orb: 900px; right: -240px; top: -300px; }
  .orb2 { --orb: 700px; left: -260px; bottom: -300px; }
</style></head>
<body>
<div class="canvas dark">
  <div class="orb"></div><div class="orb orb2"></div>
  <div class="grid-wash" style="--grid:64px"></div>
  <div class="safe">
    <div class="logo">{{svg:logo/logo-stacked-dark.svg}}</div>
    <div class="eyebrow">Agra &middot; Uttar Pradesh</div>
    <h1 class="display">Find the right advocate <span class="em">in Agra.</span></h1>
    <div class="chips">
      <span class="chip">Criminal</span><span class="chip">Family</span><span class="chip">Property</span>
      <span class="chip">Cheque Bounce</span><span class="chip">Consumer</span><span class="chip">Corporate</span>
    </div>
    <div class="url">vakilsaabagra.in</div>
  </div>
</div>
</body></html>
