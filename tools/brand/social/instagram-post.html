<!doctype html>
<html><head><meta charset="utf-8"><title>Vakil Saab Agra — Instagram post</title>
<style>
  html, body { width: 1080px; height: 1080px; }
  .canvas { width: 1080px; height: 1080px; display: grid; place-items: center; padding: 92px; }
  .inner { text-align: center; width: 100%; }
  .logo { width: 380px; margin: 0 auto; }
  .rule { width: 120px; height: 3px; margin: 40px auto 0; }
  h1 { font-size: 64px; font-weight: 700; line-height: 1.1; margin-top: 38px; }
  h1 .em { color: var(--gold-2); }
  .light h1 .em { color: var(--gold); }
  .sub { margin-top: 24px; font-size: 25px; line-height: 1.5; color: var(--slate); }
  .light .sub { color: var(--muted); }
  /* The Hindi line is the point of the second script, not decoration — it is
     the same promise, set in Noto Sans Devanagari at the same weight. */
  .hi { margin-top: 12px; font-size: 25px; color: var(--slate); }
  .light .hi { color: var(--muted); }
  .pill { margin-top: 46px; font-size: 22px; padding: 20px 44px; }
  .url { position: absolute; left: 0; right: 0; bottom: 62px; text-align: center; font-size: 22px; }
  .orb { --orb: 820px; right: -230px; top: -280px; }
  .rings { left: -140px; bottom: -140px; width: 0; height: 0; }
</style></head>
<body>
<div class="canvas dark">
  <div class="orb"></div>
  <div class="grid-wash" style="--grid:60px"></div>
  <div class="rings"><i style="width:460px;height:460px;opacity:.12"></i><i style="width:660px;height:660px;opacity:.07"></i></div>
  <div class="inner">
    <div class="logo"><span class="on-dark">{{svg:logo/logo-stacked-dark.svg}}</span><span class="on-light">{{svg:logo/logo-stacked-light.svg}}</span></div>
    <div class="rule"></div>
    <h1 class="display">Find the right advocate <span class="em">in Agra.</span></h1>
    <div class="sub">Search by practice area, experience and locality.</div>
    <div class="hi">प्रैक्टिस क्षेत्र, अनुभव और इलाके से खोजें।</div>
    <div class="pill">Browse advocates</div>
  </div>
  <div class="url">vakilsaabagra.in</div>
</div>
</body></html>
