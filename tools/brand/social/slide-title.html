<!doctype html>
<html><head><meta charset="utf-8"><title>Vakil Saab Agra — title slide</title>
<style>
  html, body { width: 1920px; height: 1080px; }
  /* A 16:9 opening slide. Drop it behind a deck as a full-bleed image and set
     the deck's own title over the empty right half, or use it as-is. */
  .canvas { width: 1920px; height: 1080px; padding: 120px 140px; display: flex; flex-direction: column; }
  .logo { width: 560px; }
  .rule { width: 150px; height: 3px; margin-top: 64px; }
  h1 { font-size: 96px; font-weight: 700; line-height: 1.06; margin-top: 54px; max-width: 1180px; }
  h1 .em { color: var(--gold-2); }
  .light h1 .em { color: var(--gold); }
  .sub { margin-top: 34px; font-size: 32px; color: var(--slate); }
  .light .sub { color: var(--muted); }
  .foot { margin-top: auto; display: flex; align-items: baseline; gap: 26px; font-size: 24px; }
  .foot .sep { color: rgba(220,184,95,.6); }
  .orb { --orb: 1100px; right: -300px; top: -380px; }
</style></head>
<body>
<div class="canvas dark">
  <div class="orb"></div>
  <div class="grid-wash" style="--grid:80px"></div>
  <div class="logo">{{svg:logo/logo-horizontal-dark.svg}}</div>
  <div class="rule"></div>
  <h1 class="display">Find the right advocate <span class="em">in Agra — fast.</span></h1>
  <div class="sub">Search by practice area, experience and locality. In Hindi or English.</div>
  <div class="foot">
    <span class="url">vakilsaabagra.in</span>
    <span class="sep">&middot;</span>
    <span class="url">A Wrath Labs venture</span>
  </div>
</div>
</body></html>
