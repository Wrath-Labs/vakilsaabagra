<!doctype html>
<html><head><meta charset="utf-8"><title>Vakil Saab Agra — X header</title>
<style>
  html, body { width: 1500px; height: 500px; }
  .canvas { width: 1500px; height: 500px; display: flex; align-items: center; padding: 0 104px; gap: 76px; }
  /* X floats the avatar over the lower left of the header, so nothing that
     has to be read is allowed below y=330 on the left third. */
  .left { flex: 0 0 336px; margin-top: -34px; }
  .right { flex: 1; }
  .eyebrow { font-size: 17px; }
  h1 { font-size: 60px; font-weight: 700; line-height: 1.08; margin-top: 18px; }
  h1 .em { color: var(--gold-2); }
  .light h1 .em { color: var(--gold); }
  .chips { gap: 12px; margin-top: 26px; }
  .chip { font-size: 16px; font-weight: 500; padding: 9px 20px; }
  .url { position: absolute; right: 104px; bottom: 40px; font-size: 20px; }
  .orb { --orb: 760px; right: -260px; top: -300px; }
  .rings { right: 120px; bottom: -220px; width: 0; height: 0; }
</style></head>
<body>
<div class="canvas dark">
  <div class="orb"></div>
  <div class="grid-wash" style="--grid:60px"></div>
  <div class="rings"><i style="width:420px;height:420px;opacity:.12"></i><i style="width:600px;height:600px;opacity:.08"></i></div>

  <div class="left logo"><span class="on-dark">{{svg:logo/logo-stacked-dark.svg}}</span><span class="on-light">{{svg:logo/logo-stacked-light.svg}}</span></div>
  <div class="right">
    <div class="eyebrow">Agra &middot; Uttar Pradesh</div>
    <h1 class="display">Find the right advocate<br><span class="em">in Agra — fast.</span></h1>
    <div class="chips">
      <span class="chip">Criminal</span><span class="chip">Family</span><span class="chip">Property</span>
      <span class="chip">Cheque Bounce</span><span class="chip">Consumer</span><span class="chip">Corporate</span>
    </div>
  </div>
  <div class="url">vakilsaabagra.in</div>
</div>
</body></html>
