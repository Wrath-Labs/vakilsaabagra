<!doctype html>
<html><head><meta charset="utf-8"><title>Vakil Saab Agra — profile picture</title>
<style>
  html, body { width: 1000px; height: 1000px; }
  /* Every platform crops a profile picture to a circle. The mark is inset far
     enough that the corners of its tile are the only thing the crop eats. */
  .canvas { width: 1000px; height: 1000px; display: grid; place-items: center; }
  .mark { width: 660px; }
  /* The light face uses the tiled mark. Its corners reach further than the
     open gold drawing does, so it comes down a size to stay inside the ring. */
  .light .mark { width: 552px; }
  .ring { position: absolute; inset: 74px; border-radius: 50%; border: 3px solid rgba(220,184,95,.30); }
  .light .ring { border-color: rgba(176,134,31,.28); }
  .orb { --orb: 900px; left: -180px; top: -220px; }
</style></head>
<body>
<div class="canvas dark">
  <div class="orb"></div>
  <div class="grid-wash" style="--grid:72px"></div>
  <div class="ring"></div>
  <div class="mark"><span class="on-dark">{{svg:icon/mark-gold.svg}}</span><span class="on-light">{{svg:icon/mark-navy.svg}}</span></div>
</div>
</body></html>
