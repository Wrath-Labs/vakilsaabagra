<!doctype html>
<meta charset="utf-8">
<title>Vakil Saab Agra — card back</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap">
<link rel="stylesheet" href="card.css">

<div class="card back">
  <div class="top-rule"></div>

  <div class="inner">
    <div class="masthead">
      <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-label="Vakil Saab Agra">
        <defs>
          <linearGradient id="bNavy" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
            <stop offset="0%" stop-color="#1b3f68"/><stop offset="50%" stop-color="#0f2540"/><stop offset="100%" stop-color="#081527"/>
          </linearGradient>
          <linearGradient id="bGold" gradientUnits="userSpaceOnUse" x1="90" y1="60" x2="430" y2="440">
            <stop offset="0%" stop-color="#f7e3a1"/><stop offset="35%" stop-color="#dcb85f"/><stop offset="70%" stop-color="#c39c40"/><stop offset="100%" stop-color="#9d7728"/>
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="116" fill="url(#bNavy)"/>
        <rect x="16" y="16" width="480" height="480" rx="102" fill="none" stroke="url(#bGold)" stroke-width="4" opacity=".5"/>
        <g fill="none" stroke="url(#bGold)" stroke-linecap="round" stroke-linejoin="round">
          <path d="M214 132 Q256 62 298 132" stroke-width="13"/>
          <path d="M256 62 V 40" stroke-width="9"/>
          <path d="M256 132 V 372" stroke-width="16"/>
          <path d="M112 186 H 400" stroke-width="16"/>
          <path d="M112 186 L 76 252 M112 186 L 148 252" stroke-width="8"/>
          <path d="M400 186 L 364 252 M400 186 L 436 252" stroke-width="8"/>
          <path d="M64 252 Q112 320 160 252" stroke-width="15"/>
          <path d="M352 252 Q400 320 448 252" stroke-width="15"/>
          <path d="M190 372 Q256 352 322 372" stroke-width="15"/>
        </g>
        <circle cx="256" cy="40" r="11" fill="url(#bGold)"/>
        <circle cx="256" cy="186" r="22" fill="url(#bGold)"/>
        <circle cx="256" cy="186" r="8" fill="#0f2540"/>
        <rect x="166" y="386" width="180" height="18" rx="9" fill="url(#bGold)"/>
        <rect x="60" y="246" width="104" height="12" rx="6" fill="url(#bGold)"/>
        <rect x="348" y="246" width="104" height="12" rx="6" fill="url(#bGold)"/>
      </svg>
      <div>
        <div class="display name">Vakil Saab</div>
        <div class="place">Agra</div>
      </div>
    </div>

    <div class="divider"></div>

    <section>
      <div class="eyebrow label">Founders</div>
      <div class="founders">
        <div class="founder">
          <div class="display fname">Subroto Banerjee</div>
          <div class="frole">Co-founder</div>
        </div>
        <div class="founder">
          <div class="display fname">Dipanshu Sarovar</div>
          <div class="frole">Co-founder</div>
        </div>
      </div>
    </section>

    <div class="divider"></div>

    <section>
      <div class="eyebrow label">Contact</div>
      <div class="contact">
        <div class="row">
          <!-- phone -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          <div class="val">+91 89544 02360</div>
        </div>
        <div class="row">
          <!-- globe -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><path d="M2 12h20"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          <div class="val">vakilsaabagra.in</div>
        </div>
        <div class="row blank">
          <!-- instagram — handle to be filled in -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5"/>
            <circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/>
          </svg>
          <div class="val"></div>
        </div>
        <div class="row blank">
          <!-- x / twitter — handle to be filled in -->
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
            <path d="M18.24 2.25h3.31l-7.23 8.26 8.5 11.24h-6.63l-5.2-6.8-5.94 6.8H1.73l7.5-8.58L1.07 2.25h6.8l4.71 6.23 5.66-6.23zm-1.16 17.52h1.83L5.72 4.13H3.75l13.33 15.64z"/>
          </svg>
          <div class="val"></div>
        </div>
      </div>
    </section>

    <div class="divider"></div>

    <div class="foot">
      <div class="wl">A Wrath Labs venture</div>
      <div>Agra &middot; Uttar Pradesh</div>
    </div>
  </div>
</div>
